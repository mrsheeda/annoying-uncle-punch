<title>Annoying Uncle Punch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: full-screen canvas arena (building cross-section with the glove launcher at the bottom), slim HUD on top, one centered card for menu / briefing / result. Single bright cartoon look by choice. */
:root {
  --bg: #2a1f3d; --card: #fff6e4; --ink: #2b1d2e; --muted: #6f5b6f; --pink: #e8506f; --gold: #f2b82c; --teal: #1f9e9a; --lock: #cdbfae;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 700; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; }
#hud {
  position: absolute; top: 0; left: 0; right: 0; box-sizing: border-box; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4);
}
#hud[hidden] { display: none; }
#lvlName { font-family: var(--display); font-size: 21px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
#counts { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums; line-height: 1.25; }
#counts b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0; }
.pill { appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-size: 16px; color: var(--ink); background: var(--card); padding: 8px 14px; border-radius: 999px; min-height: 40px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
#overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: 16px; overflow: auto; background: rgba(24,14,36,.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#overlay[hidden] { display: none; }
.card { width: min(100%, 440px); box-sizing: border-box; background: var(--card); border-radius: 22px; padding: 22px 20px; box-shadow: 0 8px 0 rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 14px; margin: auto; }
.card h1, .card h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
.card h1 { font-size: 44px; color: var(--pink); text-shadow: 0 3px 0 rgba(43,29,46,.14); }
.card h2 { font-size: 34px; }
.card p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tile { appearance: none; border: 0; cursor: pointer; color: #fff; background: var(--teal); border-radius: 12px; padding: 8px 2px 6px; box-shadow: 0 3px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; }
.tile .n { font-family: var(--display); font-size: 22px; line-height: 1; }
.tile .st { font-size: 11px; letter-spacing: 0; color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.3); line-height: 1; }
.tile.cur { background: var(--pink); }
.tile .st .off { color: rgba(0,0,0,.3); text-shadow: none; }
input { user-select: text; -webkit-user-select: text; }
#overlay { touch-action: pan-y; }
.card input[type=range] { width: 100%; box-sizing: border-box; accent-color: var(--pink); height: 30px; margin: 0; }
.msg { min-height: 1.3em; font-size: 14px; color: #b3243e; text-align: center; }
.btn.resume { background: var(--gold); color: var(--ink); }
.row.quick .btn { font-size: 18px; min-height: 44px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: -6px; }
.tile[disabled] { background: var(--lock); cursor: not-allowed; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.row.nav { align-items: center; flex-wrap: nowrap; gap: 6px; } .row.nav .btn { flex: 0 0 46px; padding: 6px 0; font-size: 22px; min-height: 46px; } .row.nav .big { flex: 1; font-size: 16px; white-space: nowrap; }
.jump input { flex: 2 1 140px; min-width: 0; box-sizing: border-box; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 14px; border: 3px solid #d9ccb7; background: #fff; color: var(--ink); }
.btn { appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-size: 24px; color: #fff; background: var(--pink); padding: 12px 18px; border-radius: 16px; min-height: 52px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.btn.alt { background: var(--teal); } .btn.ghost { background: #eadfcb; color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row .btn { flex: 1 1 120px; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.rules { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.stars { font-size: 44px; color: var(--gold); letter-spacing: 6px; text-shadow: 0 3px 0 rgba(0,0,0,.18); text-align: center; }
.stars .off { color: #d9ccb7; }
.big { font-family: var(--display); font-size: 20px; text-align: center; }
</style>

<canvas id="c"></canvas>

<div id="hud" hidden>
  <button class="pill" id="menuBtn" type="button">Menu</button>
  <div id="lvlName"></div>
  <div id="counts"><span>Gloves <b id="gl">0</b></span><span>Uncles <b id="un">0</b></span></div>
</div>

<div id="overlay"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cvs = $('c'), ctx = cvs.getContext('2d');
  var LW = 400, LH = 620, LX = 200, LY = 556, SPEED = 800, GRAV = 520;

  /* ---------- levels ---------- */
  var SHIRTS = ['#3d7ea6', '#c0563a', '#4f8a5b', '#8a5fb0', '#d9a21b', '#2f6bb0'];
  var LABELS = { stand: 'Nosy Uncle', sit: 'Chai Uncle', run: 'Jogging Uncle', dance: 'Dance Uncle', sleep: 'Sleepy Uncle', jump: 'Bouncy Uncle', peek: 'Sneaky Uncle', swing: 'Swing Uncle', boss: 'Big Uncle' };
  function P(y, x0, x1) { return { y: y, x0: x0 == null ? 0 : x0, x1: x1 == null ? 400 : x1 }; }
  var LEVELS = [
    { name: 'Standing Around', bg: 'living', ammo: 3, plats: [P(340)], uncles: [{ t: 'stand', p: 0, x: 250 }] },
    { name: 'Sofa Time', bg: 'living', ammo: 5, plats: [P(360)], uncles: [{ t: 'sit', p: 0, x: 105 }, { t: 'stand', p: 0, x: 290 }] },
    { name: 'Morning Jog', bg: 'park', ammo: 6, plats: [P(300), P(450)], uncles: [{ t: 'run', p: 0, x: 120, sp: 90 }, { t: 'run', p: 1, x: 280, sp: 70 }] },
    { name: 'Dance Party', bg: 'wedding', ammo: 7, plats: [P(320), P(460)], uncles: [{ t: 'dance', p: 0, x: 100 }, { t: 'dance', p: 0, x: 290 }, { t: 'stand', p: 1, x: 200, hp: 2 }] },
    { name: 'Nap Time', bg: 'bedroom', ammo: 7, plats: [P(310), P(450)], uncles: [{ t: 'sleep', p: 0, x: 120 }, { t: 'sit', p: 0, x: 300 }, { t: 'sleep', p: 1, x: 260 }] },
    { name: 'Trampoline', bg: 'park', ammo: 8, plats: [P(450)], uncles: [{ t: 'jump', p: 0, x: 80, ph: 0 }, { t: 'jump', p: 0, x: 200, ph: 2 }, { t: 'jump', p: 0, x: 320, ph: 4 }] },
    { name: 'Peek-a-Boo', bg: 'roof', ammo: 9, plats: [P(300), P(450)], uncles: [{ t: 'peek', p: 0, x: 90, off: 0 }, { t: 'peek', p: 0, x: 310, off: 1.4 }, { t: 'peek', p: 1, x: 200, off: .7 }, { t: 'stand', p: 1, x: 340 }] },
    { name: 'Playground', bg: 'playground', ammo: 9, plats: [P(470)], uncles: [{ t: 'swing', p: -1, x: 105, ph: 0 }, { t: 'swing', p: -1, x: 295, ph: 2.2 }, { t: 'run', p: 0, x: 200, sp: 80 }] },
    { name: 'Gym Bro Uncle', bg: 'gym', ammo: 9, plats: [P(340), P(480)], uncles: [{ t: 'stand', p: 0, x: 210, hp: 4, big: true }, { t: 'run', p: 1, x: 120, sp: 110 }, { t: 'dance', p: 1, x: 300 }] },
    { name: 'Family Chaos', bg: 'disco', ammo: 12, plats: [P(280), P(390), P(500)], uncles: [{ t: 'run', p: 0, x: 100, sp: 100 }, { t: 'sleep', p: 0, x: 300 }, { t: 'peek', p: 1, x: 90, off: 0 }, { t: 'jump', p: 1, x: 300, ph: 1 }, { t: 'dance', p: 2, x: 120 }, { t: 'stand', p: 2, x: 300, hp: 2 }] }
  ];
  var BGS = { living: ['#f0c98f', '#b57a4a'], park: ['#8ed1f0', '#6fbf6a'], wedding: ['#8c2a52', '#3d1030'], bedroom: ['#6f86c9', '#2e3a6e'], roof: ['#ff9d6b', '#4a3a6a'], playground: ['#9fdcf5', '#7cc86a'], gym: ['#c4cad3', '#6a7380'], disco: ['#5a2f9a', '#1d0b3a'] };

  var save = { stars: {} };
  try { var raw = localStorage.getItem('annoying-uncle-punch'); if (raw) save = JSON.parse(raw) || save; if (!save.stars) save.stars = {}; } catch (e) { save = { stars: {} }; }
  function persist() { try { localStorage.setItem('annoying-uncle-punch', JSON.stringify(save)); } catch (e) {} pushCloud(); }
  var cloud = { doc: null, busy: false, dirty: false };
  function mergeStars(src) { var ch = false; Object.keys(src || {}).forEach(function (k) { var v = src[k] | 0; if (v > (save.stars[k] || 0)) { save.stars[k] = v; ch = true; } }); return ch; }
  function pushCloud() {
    if (!cloud.doc) return; if (cloud.busy) { cloud.dirty = true; return; }
    cloud.busy = true; cloud.dirty = false;
    cloud.doc.set({ stars: save.stars, t: Date.now() }).catch(function () {}).then(function () { cloud.busy = false; if (cloud.dirty) pushCloud(); });
  }
  function initCloud() {
    try {
      if (!window.claude || !window.claude.use) return;
      Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (r) {
        var user = r[0], db = r[1]; if (!user || !db) return;
        return Promise.resolve(user.id()).then(function (id) {
          if (!id) return null; cloud.doc = db.doc('data/users/' + id + '/progress'); return cloud.doc.get();
        }).then(function (snap) {
          if (!snap) return; var d = snap.exists ? snap.data() : null, remote = (d && d.stars) || {};
          var changed = mergeStars(remote);
          if (changed) { try { localStorage.setItem('annoying-uncle-punch', JSON.stringify(save)); } catch (e) {} if (screen === 'menu') { PAGE = null; menu(); } }
          if (Object.keys(save.stars).some(function (k) { return (remote[k] | 0) < save.stars[k]; })) pushCloud();
        });
      }).catch(function () {});
    } catch (e) {}
  }
  function unlocked(i) { return i === 0 || (save.stars[i - 1] || 0) > 0; }


  /* ---------- endless level generator ---------- */
  var TOTAL = 3000, cache = {};
  function rngOf(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var ADJ = ['Noisy', 'Sneaky', 'Sleepy', 'Bouncy', 'Chatty', 'Grumpy', 'Cheeky', 'Fussy', 'Loud', 'Nosy'];
  var PLACE = ['Dinner', 'Wedding', 'Picnic', 'Reunion', 'Rooftop', 'Garden', 'Party', 'Gym', 'Bazaar', 'Birthday'];
  function gen(i) {
    var n = i + 1, r = rngOf(n * 7919 + 101);
    var rr = function (a, b) { return a + r() * (b - a); }, ri = function (a, b) { return Math.floor(rr(a, b + 1)); };
    var boss = n % 10 === 0, count = Math.min(9, 2 + Math.floor(n / 70) + ri(0, 2) + (boss ? 1 : 0));
    var useSwing = !boss && r() < .12, bgKeys = Object.keys(BGS).filter(function (k) { return k !== 'playground'; }), bg, plats;
    if (useSwing) { bg = 'playground'; plats = [P(470)]; }
    else {
      bg = bgKeys[ri(0, bgKeys.length - 1)];
      var np = count <= 2 ? 1 : count <= 4 ? ri(1, 2) : ri(2, 3);
      plats = np === 1 ? [P(Math.round(rr(330, 470)))] : np === 2 ? [P(Math.round(rr(290, 330))), P(Math.round(rr(440, 480)))] : [P(280), P(390), P(500)];
    }
    var types = ['stand', 'sit', 'run', 'dance', 'sleep', 'jump', 'peek'], uncles = [], used = plats.map(function () { return []; }), swings = 0, totalHp = 0;
    for (var k = 0; k < count; k++) {
      var t = types[ri(0, types.length - 1)], big = false;
      if (useSwing && swings < 2 && r() < .55) { t = 'swing'; swings++; }
      if (boss && k === 0) { t = 'stand'; big = true; }
      var p = t === 'swing' ? -1 : ri(0, plats.length - 1), x = null;
      if (t === 'swing') x = swings === 1 ? 105 : 295;
      else for (var tr = 0; tr < 24 && x === null; tr++) {
        var cx = Math.round(t === 'sleep' ? rr(100, 300) : rr(60, 340)), gap = t === 'sleep' ? 150 : 95;
        if (used[p].every(function (q) { return Math.abs(q - cx) >= gap; })) x = cx;
        if (tr === 12) p = (p + 1) % plats.length;
      }
      if (x === null) continue;
      if (p >= 0) used[p].push(x);
      var d = { t: t, p: p, x: x };
      if (t === 'run') d.sp = Math.round(70 + Math.min(120, n * .05) + rr(0, 30));
      if (t === 'jump' || t === 'swing') d.ph = rr(0, 6);
      if (t === 'peek') d.off = rr(0, 3);
      if (big) { d.big = true; d.hp = Math.min(8, 3 + Math.floor(n / 80)); }
      else if (r() < Math.min(.4, n / 600)) d.hp = r() < Math.min(.25, n / 2500) ? 3 : 2;
      totalHp += d.hp || 1; uncles.push(d);
    }
    if (!uncles.length) { uncles.push({ t: 'stand', p: 0, x: 200 }); totalHp = 1; }
    var ammo = totalHp + 1 + Math.ceil(uncles.length * Math.max(.3, .8 - n / 3000));
    return { name: ADJ[ri(0, ADJ.length - 1)] + ' ' + PLACE[ri(0, PLACE.length - 1)] + (boss ? ' (Boss)' : ''), bg: bg, ammo: ammo, plats: plats, uncles: uncles };
  }
  function getLevel(i) { if (i < LEVELS.length) return LEVELS[i]; return cache[i] || (cache[i] = gen(i)); }
  function needHits(L) { return L.uncles.reduce(function (a, u) { return a + (u.hp || 1); }, 0); }

  /* ---------- audio ---------- */
  var actx = null;
  function ac() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } }
  function tone(f1, f2, d, type, vol) {
    var a = ac(); if (!a) return;
    try { var o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
  }
  function noise(d, vol) {
    var a = ac(); if (!a) return;
    try { var n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0); for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); var s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start(); } catch (e) {}
  }
  var sFire = function () { tone(180, 520, .16, 'triangle', .12); noise(.06, .12); };
  var sHit = function () { tone(220, 60, .16, 'square', .14); noise(.08, .25); };
  var sKO = function () { tone(700, 1400, .2, 'triangle', .1); };
  var sBounce = function () { tone(300, 450, .06, 'sine', .05); };
  var sWin = function () { tone(500, 800, .15, 'triangle', .12); setTimeout(function () { tone(800, 1300, .3, 'triangle', .12); }, 150); };
  var sLose = function () { tone(260, 90, .5, 'sawtooth', .1); };

  /* ---------- view ---------- */
  var view = { w: 0, h: 0, dpr: 1, sc: 1, ox: 0, oy: 0 };
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = window.innerWidth, h = window.innerHeight;
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    var top = 64, availH = Math.max(240, h - top), sc = Math.min(w / LW, availH / LH);
    view = { w: w, h: h, dpr: dpr, sc: sc, ox: (w - LW * sc) / 2, oy: top + (availH - LH * sc) / 2 };
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- game ---------- */
  var G = null;
  function mk(d, L, i) {
    var plat = d.p >= 0 ? L.plats[d.p] : null, big = !!d.big, s = big ? .98 : .74;
    var u = { t: d.t, x: d.x, y: plat ? plat.y : 0, base: plat ? plat.y : 0, plat: plat, s: s, dir: d.x < 200 ? 1 : -1, hp: d.hp || 1, maxHp: d.hp || 1,
      state: 'alive', t0: Math.random() * 6, phase: d.ph || 0, speed: d.sp || 0, off: d.off || 0, shirt: SHIRTS[i % SHIRTS.length], hat: ['none', 'cap', 'hat', 'none', 'band', 'cap'][i % 6],
      stun: 0, vx: 0, vy: 0, rot: 0, spin: 0, cx: 0, cy: 0, koT: 0, label: big ? LABELS.boss : LABELS[d.t], big: big, peekP: 1, pivot: { x: d.x, y: 70 }, len: 0, hitBy: -1, pairs: {} };
    if (d.t === 'swing') { u.len = 290 - 70 - 60; u.pivot = { x: d.x, y: 120 }; u.len = 250; }
    return u;
  }
  function newGame(idx) {
    var L = getLevel(idx);
    G = { idx: idx, L: L, uncles: L.uncles.map(function (d, i) { return mk(d, L, i); }), gloves: [], ammo: L.ammo, used: 0, t: 0, aim: null, over: false, won: false, endT: 0, shown: false, running: true, idleT: 0,
      floats: [], parts: [], bursts: [], shake: 0, flash: 0, recoil: 0, gid: 0, kills: 0 };
    updateHud();
  }
  function aliveCount() { return G.uncles.filter(function (u) { return u.state === 'alive' || u.state === 'stun'; }).length; }
  function updateHud() { if (!G) return; $('lvlName').textContent = (G.idx + 1) + '. ' + G.L.name; $('gl').textContent = G.ammo; $('un').textContent = aliveCount(); }
  function floatText(x, y, text, color, size) { G.floats.push({ x: x, y: y, t: 0, text: text, color: color, size: size || 26 }); }
  function burst(x, y, n, gold) { for (var i = 0; i < n; i++) { var a = Math.random() * 6.283, s = 80 + Math.random() * 170; G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, t: 0, life: 500 + Math.random() * 400, gold: gold, r: 4 + Math.random() * 6 }); } }

  /* hit ellipse in world coords, or null if untouchable */
  function hitbox(u) {
    var s = u.s;
    if (u.state === 'ko') return { cx: u.cx, cy: u.cy, rx: 30 * s, ry: 42 * s };
    switch (u.t) {
      case 'sit': return { cx: u.x, cy: u.y - 50 * s, rx: 36 * s, ry: 46 * s };
      case 'sleep': return { cx: u.x, cy: u.y - 56 * s, rx: 74 * s, ry: 28 * s };
      case 'peek': if (u.peekP < .5) return null; return { cx: u.x, cy: u.y - 46 * s - u.peekP * 28 * s, rx: 26 * s, ry: 32 * s };
      default: return { cx: u.x, cy: u.y - 72 * s, rx: 27 * s, ry: 70 * s };
    }
  }
  function overlap(e, x, y, r) { var dx = (x - e.cx) / (e.rx + r), dy = (y - e.cy) / (e.ry + r); return dx * dx + dy * dy < 1; }

  function hitUncle(u, vx, vy, gid, fromChain) {
    if (u.state !== 'alive' && u.state !== 'stun') return;
    u.hp--; var hb = hitbox(u) || { cx: u.x, cy: u.y - 60 };
    sHit(); G.shake = 160; burst(hb.cx, hb.cy, 9, false);
    G.bursts.push({ x: hb.cx, y: hb.cy, t: 0, text: pick(['POW!', 'BAM!', 'WHAP!', 'BOP!', 'SMACK!']) });
    if (u.hp > 0) {
      u.state = 'stun'; u.stun = .55; u.x += Math.sign(vx || 1) * 10; floatText(hb.cx, hb.cy - 50, 'Ouch! ' + u.hp + ' left', '#fff', 22); return;
    }
    u.cx = hb.cx; u.cy = hb.cy; u.state = 'ko'; u.koT = 0;
    var ang = Math.atan2(vy, vx);
    u.vx = Math.cos(ang) * 720; u.vy = Math.sin(ang) * 720;
    u.spin = (u.vx >= 0 ? 1 : -1) * 9; u.pairs[u.hitBy] = 1;
    G.kills++; sKO(); G.shake = 240; G.flash = 90;
    var g = G.gloves.filter(function (q) { return q.id === gid; })[0];
    if (g) { g.kills++; if (g.kills === 2) floatText(CX2(), 200, 'DOUBLE KO!', '#ffd166', 38); if (g.kills >= 3) floatText(CX2(), 200, 'TRIPLE KO!', '#ffd166', 42); }
    if (fromChain) floatText(hb.cx, hb.cy - 60, 'CHAIN!', '#ff8fa3', 32);
    floatText(hb.cx, hb.cy - 40, 'KO!', '#ffd166', 34);
    burst(hb.cx, hb.cy, 16, true);
    updateHud();

  }

  function tag(c, x, y, text, hpFrac, hp, maxHp) {

  function drawUncle(c, u, tm) {
    var s = u.s;

  }

  /* boxing glove facing +x, origin at the fist */

    c.lineJoin = 'round'; c.lineCap = 'round';
    c.fillStyle = '#f4efe6'; rrect(c, -36, -11, 26, 22, 5); c.fill(); c.strokeStyle = '#b9b2a4'; c.lineWidth = 1.5; c.stroke();

    var g = c.createRadialGradient(12, -7, 3, 8, 0, 25); g.addColorStop(0, '#ff7a8d'); g.addColorStop(.55, '#e63950'); g.addColorStop(1, '#b01c33');
    c.fillStyle = g; c.beginPath(); c.ellipse(8, 0, 21, 17, 0, 0, 7); c.fill(); c.strokeStyle = '#8f1a2c'; c.lineWidth = 1.6; c.stroke();
    c.fillStyle = '#d12b42'; c.beginPath(); c.ellipse(1, 12, 12, 7, -.25, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(110,10,30,.55)'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(22, -9); c.quadraticCurveTo(16, -5, 22, -1); c.moveTo(23, 2); c.quadraticCurveTo(17, 6, 23, 10); c.stroke();

  }
  function drawGlove(c, g, tm, scale) {
    var ang = g.spent ? g.rot : Math.atan2(g.vy, g.vx);
    c.save(); c.translate(g.x, g.y); c.rotate(ang); c.scale((scale || 1) * .62, (scale || 1) * .62); gloveShape(c); c.restore();
  }
  function drawBG(c, L, tm) {
    var v = view, pal = BGS[L.bg], g = c.createLinearGradient(0, 0, 0, v.h);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]); c.fillStyle = g; c.fillRect(0, 0, v.w, v.h);

      case 'park': c.fillStyle = 'rgba(255,255,255,.7)'; [[70, 120, 30], [300, 160, 26]].forEach(function (q) { c.beginPath(); c.arc(q[0], q[1], q[2], 0, 7); c.arc(q[0] + 26, q[1] + 6, q[2] - 6, 0, 7); c.arc(q[0] - 24, q[1] + 8, q[2] - 8, 0, 7); c.fill(); }); c.fillStyle = 'rgba(40,120,60,.5)'; c.beginPath(); c.arc(330, 250, 60, 0, 7); c.fill(); break;

      case 'bedroom': c.fillStyle = '#ffeaa8'; c.beginPath(); c.arc(320, 120, 30, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.6)'; for (var s = 0; s < 14; s++) c.fillRect((s * 71) % LW, 70 + (s * 37) % 180, 3, 3); break;
      case 'roof': c.fillStyle = 'rgba(40,30,70,.6)'; [[0, 180, 60], [60, 150, 50], [120, 200, 70], [210, 160, 60], [280, 190, 50], [335, 140, 70]].forEach(function (b) { c.fillRect(b[0], b[1] + 100, b[2], 400); }); break;
      case 'playground': c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(80, 130, 28, 0, 7); c.arc(110, 136, 22, 0, 7); c.fill(); c.fillStyle = '#6b4a2a'; c.fillRect(70, 112, 10, 380); c.fillRect(320, 112, 10, 380); c.fillRect(66, 110, 268, 12); break;
      case 'gym': c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(40, 140, 120, 14); c.fillRect(32, 120, 12, 54); c.fillRect(156, 120, 12, 54); c.fillRect(250, 160, 100, 12); break;
      case 'disco': for (var d = 0; d < 6; d++) { c.fillStyle = 'hsla(' + ((tm / 20 + d * 60) % 360) + ',90%,60%,.12)'; c.beginPath(); c.moveTo(60 + d * 55, 60); c.lineTo(d * 80 - 20, 600); c.lineTo(d * 80 + 110, 600); c.fill(); } break;
    }
    c.restore();
  }
  function drawPlat(c, p) {
    c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(p.x0, p.y + 18, p.x1 - p.x0, 6);
    c.fillStyle = '#7a4a2a'; rrect(c, p.x0 - 4, p.y, p.x1 - p.x0 + 8, 18, 5); c.fill();
    c.fillStyle = '#a8703c'; rrect(c, p.x0 - 4, p.y - 2, p.x1 - p.x0 + 8, 7, 3); c.fill();
  }
  function wheel(c, x, y, r) {
    c.fillStyle = '#2b1d2e'; c.beginPath(); c.arc(x, y, r + 3, 0, 7); c.fill(); c.fillStyle = '#8a5528'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();

    c.fillStyle = '#b8bfce'; c.beginPath(); c.arc(x, y, 4.5, 0, 7); c.fill();
  }
  function drawLauncher(c, tm) {
    var aim = G.aim ? clampAim(G.aim) : { dx: 0, dy: -1 }, ang = Math.atan2(aim.dy, aim.dx), px = LX, py = LY;
    var rec = G.recoil > 0 ? G.recoil / 160 * 14 : 0;
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(px, py + 46, 86, 12, 0, 0, 7); c.fill();
    var bg = c.createLinearGradient(0, py + 16, 0, py + 42); bg.addColorStop(0, '#6b7183'); bg.addColorStop(1, '#343845');
    c.fillStyle = bg; c.beginPath(); c.moveTo(px - 72, py + 42); c.lineTo(px - 54, py + 16); c.lineTo(px + 54, py + 16); c.lineTo(px + 72, py + 42); c.closePath(); c.fill(); c.strokeStyle = '#23252e'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#aab2c2'; [-48, -24, 0, 24, 48].forEach(function (x) { c.beginPath(); c.arc(px + x, py + 34, 2.5, 0, 7); c.fill(); });
    wheel(c, px - 54, py + 30, 16); wheel(c, px + 54, py + 30, 16);
    /* barrel (drawn pointing +x, then rotated to the aim) */
    c.save(); c.translate(px, py); c.rotate(ang); c.translate(-rec, 0);
    var gr = c.createLinearGradient(0, -26, 0, 26); gr.addColorStop(0, '#3a3e4b'); gr.addColorStop(.3, '#a6aebe'); gr.addColorStop(.48, '#e1e6ef'); gr.addColorStop(.7, '#7a8296'); gr.addColorStop(1, '#323642');
    if (G.ammo > 0 && !G.over) { c.save(); c.translate(86, 0); gloveShape(c); c.restore(); }
    c.fillStyle = '#3a3e4b'; c.beginPath(); c.arc(-24, 0, 21, 0, 7); c.fill(); c.beginPath(); c.arc(-48, 0, 8, 0, 7); c.fill();
    c.fillStyle = gr; c.beginPath(); c.moveTo(-24, -19); c.lineTo(60, -26); c.lineTo(60, 26); c.lineTo(-24, 19); c.closePath(); c.fill(); c.strokeStyle = '#23252e'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#f2b82c'; rrect(c, 8, -23, 7, 46, 3); c.fill(); rrect(c, 36, -25, 7, 50, 3); c.fill();
    c.fillStyle = gr; rrect(c, 58, -31, 18, 62, 6); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, -14); c.lineTo(54, -20); c.stroke();
    c.restore();
    var dg = c.createRadialGradient(px - 9, py - 12, 4, px, py, 36); dg.addColorStop(0, '#ff8fa3'); dg.addColorStop(.6, '#e8506f'); dg.addColorStop(1, '#a82a47');
    c.fillStyle = dg; c.beginPath(); c.arc(px, py + 6, 30, Math.PI, 0); c.lineTo(px + 30, py + 20); c.lineTo(px - 30, py + 20); c.closePath(); c.fill(); c.strokeStyle = '#7c1f38'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#f2b82c'; rrect(c, px - 35, py + 15, 70, 8, 4); c.fill(); c.strokeStyle = '#9a6d0a'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(px - 11, py - 10, 10, 5, -.5, 0, 7); c.fill();
  }
  function drawAim(c) {
    if (!G.aim || G.ammo <= 0) return;
    var a = clampAim(G.aim), x = LX + a.dx * 74, y = LY + a.dy * 74, vx = a.dx * SPEED, vy = a.dy * SPEED, dt = .035;
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (var i = 0; i < 16; i++) { x += vx * dt; y += vy * dt; vy += GRAV * dt; if (x < 14 || x > LW - 14 || y < 12) break; c.globalAlpha = 1 - i / 18; c.beginPath(); c.arc(x, y, 4 - i * .1, 0, 7); c.fill(); }
    c.globalAlpha = 1;
  }

  function render(tm) {
    var c = ctx, v = view;
    c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
    if (!G) { c.fillStyle = '#2a1f3d'; c.fillRect(0, 0, v.w, v.h); return; }
    drawBG(c, G.L, tm);
    var sx = 0, sy = 0; if (G.shake > 0) { var m = Math.min(1, G.shake / 200) * 7; sx = (Math.random() - .5) * m; sy = (Math.random() - .5) * m; }
    c.translate(v.ox + sx, v.oy + sy); c.scale(v.sc, v.sc);
    c.save(); c.beginPath(); c.rect(0, 0, LW, LH); c.clip();
    G.L.plats.forEach(function (p) { drawPlat(c, p); });
    G.uncles.forEach(function (u) { if (u.state !== 'ko') drawUncle(c, u, tm); });
    G.uncles.forEach(function (u) { if (u.state === 'ko') drawUncle(c, u, tm); });
    drawAim(c); drawLauncher(c, tm);
    G.gloves.forEach(function (g) { drawGlove(c, g, tm, 1); });
    G.parts.forEach(function (p) { c.globalAlpha = 1 - p.t / p.life; star(c, p.x, p.y, p.r, p.gold ? '#ffe28a' : '#ffd166'); }); c.globalAlpha = 1;
    G.bursts.forEach(function (b) {
      var p = b.t / 360, sc = .5 + Math.min(1, p * 4) * .7;
      c.save(); c.translate(b.x, b.y); c.scale(sc, sc); c.rotate(-.12); c.globalAlpha = Math.max(0, 1 - p * p);
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#2b1d2e'; c.lineWidth = 3; c.beginPath(); for (var i = 0; i < 16; i++) { var a = i * Math.PI / 8, r = i % 2 ? 24 : 42; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); c.stroke();
      c.font = '20px "Lilita One", Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#e63950'; c.strokeStyle = '#fff'; c.lineWidth = 4; c.strokeText(b.text, 0, 1); c.fillText(b.text, 0, 1); c.restore();
    });
    G.floats.forEach(function (f) { c.globalAlpha = Math.max(0, 1 - f.t / 950); c.font = f.size + 'px "Lilita One", Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineWidth = 5; c.strokeStyle = '#2b1d2e'; c.strokeText(f.text, f.x, f.y - f.t * .06); c.fillStyle = f.color; c.fillText(f.text, f.x, f.y - f.t * .06); }); c.globalAlpha = 1;
    c.restore();
    if (G.flash > 0) { c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0); c.fillStyle = 'rgba(255,255,255,' + Math.min(.45, G.flash / 200) + ')'; c.fillRect(0, 0, v.w, v.h); }
  }

  var last = performance.now();
  function frame(now) { requestAnimationFrame(frame); var dt = Math.min(50, now - last); last = now; if (document.hidden) return; update(dt); render(now); }
  menu(); initCloud(); requestAnimationFrame(frame);
})();
